[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockurl"
version = "5.0.0"
description = "BlockURL Self Hosted Server (NiceGUI)"
requires-python = ">=3.10"

dependencies = [
    "nicegui>=3,<4",
    "peewee>=3.17,<4",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
blockurl-server = "blockurl.__main__:launch_app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p nicegui.testing.user_plugin"
# The UI tests drive the real entry point, which registers every page and route.
main_file = "tests/ui_main.py"
markers = ["blockurl_api_key: run the app with this API key configured"]